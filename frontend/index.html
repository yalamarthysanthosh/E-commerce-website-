<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcousticX 3D Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
  /* For staggered animations */
  .stagger-in > * {
    opacity: 0;
    animation: fadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Custom pulse for buttons */
  @keyframes button-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(22, 163, 175, 0.7); /* cyan-600 */
    }
    70% {
      box-shadow: 0 0 0 10px rgba(22, 163, 175, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(22, 163, 175, 0);
    }
  }
  
  .animate-button-pulse {
    animation: button-pulse 2s infinite;
  }

  /* Custom slow rotation for icons */
  @keyframes slow-rotate {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
  .animate-slow-rotate {
    animation: slow-rotate 10s linear infinite;
  }

  /* Sound wave for speaker icon */
  @keyframes sound-wave {
    0% {
      transform: scale(1);
      opacity: 0.6;
    }
    100% {
      transform: scale(2.5);
      opacity: 0;
    }
  }
  .group:hover .sound-wave-1 {
    animation: sound-wave 1.5s ease-out infinite;
  }
  .group:hover .sound-wave-2 {
    animation: sound-wave 1.5s 0.5s ease-out infinite;
  }

  /* Emoji Pop Animation */
  @keyframes emoji-pop {
    0% {
      transform: translate(-50%, -50%) scale(0);
      opacity: 1;
    }
    50% {
      transform: translate(-50%, -150%) scale(1.2);
    }
    100% {
      transform: translate(-50%, -200%) scale(1);
      opacity: 0;
    }
  }
  .animate-emoji-pop {
    animation: emoji-pop 1s ease-out forwards;
  }
  
  /* Toast Notifications */
  @keyframes toast-in {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }
  @keyframes toast-out {
    from {
      transform: translateX(0);
      opacity: 1;
    }
    to {
      transform: translateX(100%);
      opacity: 0;
    }
  }
  .animate-toast-in {
    animation: toast-in 0.3s ease-out forwards;
  }
  .animate-toast-out {
    animation: toast-out 0.3s ease-in forwards;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
